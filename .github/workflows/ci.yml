name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Markdown, metadata and local images
        run: npm run content:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and security tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile smoke tests
        run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy production to Vercel
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VERCEL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check deployment configuration
        shell: bash
        run: |
          for key in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing deployment secret: $key"
              exit 1
            fi
          done
      - run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifacts with Vercel configuration
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Avoid releasing an older main commit after a newer run
        id: release
        shell: bash
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$current_sha" ]; then
            echo "::error::Cannot determine the current main commit"
            exit 1
          fi
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; skipping this older deployment."
          fi
      - name: Deploy the prebuilt artifacts
        if: steps.release.outputs.current == 'true'
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
      - name: Check deployed public routes
        if: steps.release.outputs.current == 'true'
        run: node scripts/deployment-check.mjs
